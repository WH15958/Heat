name: 双注射泵顺序协作示例（泵2待配置）
description: 双泵使用独立串口。开始前检查全部引用设备；泵2未连接时不会启动泵1。非同步启动。
metadata:
  material_system: water
  recipe_version: syringe-example-v1
  safety_notes: 两套水路均须实机验收；暂停不打断已下发动作。无漏液或液位传感能力。
steps:
  - id: initialize_pump1
    type: syringe_pump.initialize
    params: {device_id: syringe_pump1, direction: Z, confirm: true, timeout: 120}
  - id: initialize_pump2
    type: syringe_pump.initialize
    params: {device_id: syringe_pump2, direction: Z, confirm: true, timeout: 120}
  - id: aspirate_pump1
    type: syringe_pump.aspirate
    params: {device_id: syringe_pump1, volume: 100, unit: uL, speed: 100, timeout: 120}
  - id: aspirate_pump2
    type: syringe_pump.aspirate
    params: {device_id: syringe_pump2, volume: 100, unit: uL, speed: 100, timeout: 120}
  - id: dispense_pump1
    type: syringe_pump.dispense
    params: {device_id: syringe_pump1, volume: 100, unit: uL, speed: 100, timeout: 120}
  - id: dispense_pump2
    type: syringe_pump.dispense
    params: {device_id: syringe_pump2, volume: 100, unit: uL, speed: 100, timeout: 120}
