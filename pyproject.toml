[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heat"
version = "0.1.0"
description = "自动化控制系统"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = []
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "matplotlib>=3.5.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
windows = [
    "pywin32>=306",
    "psutil>=5.9.0",
]

[project.scripts]
heat = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
