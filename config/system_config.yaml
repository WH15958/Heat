name: "自动化控制系统"
version: "1.0.0"

heaters:
  - device_id: "heater1"
    name: "加热器1"
    connection:
      port: "COM7"
      baudrate: 9600
      address: 1
      parity: "N"
      timeout: 2.0
      binding:
        mode: "fingerprint"
        vid: 6790
        pid: 29987
        location: "1-3.3"
    decimal_places: 1
    temperature_unit: "C"
    max_temperature: 400.0
    min_temperature: 0.0
    safety_limit: 450.0
    poll_interval: 1.0
    retry_count: 3
    retry_delay: 0.5
    enabled: true

  - device_id: "heater2"
    name: "加热器2"
    connection:
      port: "COM8"
      baudrate: 9600
      address: 1
      parity: "N"
      timeout: 2.0
      binding:
        mode: "fingerprint"
        vid: 6790
        pid: 29987
        location: "1-3.2"
    decimal_places: 1
    temperature_unit: "C"
    max_temperature: 400.0
    min_temperature: 0.0
    safety_limit: 450.0
    poll_interval: 1.0
    retry_count: 3
    retry_delay: 0.5
    enabled: true

pumps:
  - device_id: "pump1"
    name: "蠕动泵"
    connection:
      port: "COM10"
      baudrate: 19200
      parity: "E"
      stopbits: 1
      bytesize: 8
      binding:
        mode: "fingerprint"
        serial_number: "CNDIB148313"
    slave_address: 1
    timeout: 2.0
    poll_interval: 1.0
    retry_count: 3
    retry_delay: 0.5
    enabled: true
    channels:
      - channel: 1
        enabled: true
        pump_head: 5
        tube_model: 11
        suck_back_angle: 0
        max_flow_rate: 18.75
      - channel: 2
        enabled: true
        pump_head: 5
        tube_model: 11
        suck_back_angle: 0
        max_flow_rate: 18.75
      - channel: 3
        enabled: true
        pump_head: 5
        tube_model: 11
        suck_back_angle: 0
        max_flow_rate: 18.75
      - channel: 4
        enabled: true
        pump_head: 5
        tube_model: 11
        suck_back_angle: 0
        max_flow_rate: 18.75

microwaves:
  - device_id: "microwave1"
    name: "MKM-AH1E微波合成仪"
    connection:
      port: "COM12"
      baudrate: 9600
      address: 1
      parity: "N"
      timeout: 2.0
      binding:
        mode: "fingerprint"
        serial_number: "BG047ZQIA"
    slave_address: 1
    max_temperature: 300.0
    max_power_percent: 100
    poll_interval: 1.0
    retry_count: 3
    retry_delay: 0.5
    enabled: true
    allow_experiment_control: true
    allow_real_hardware_writes: true
    enable_control_writes: true

monitor:
  enabled: true
  log_interval: 1.0
  data_retention_hours: 24
  alarm_check_interval: 0.5
  enable_csv_logging: true
  enable_database: false
  database_path: "data/monitor.db"

report:
  output_dir: "reports"
  default_format: "html"
  include_charts: true
  include_statistics: true
  auto_generate: false
  template_dir: "templates"

logging:
  level: "INFO"
  log_dir: "logs"
  max_file_size_mb: 10
  backup_count: 5
  console_output: true
  file_output: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
